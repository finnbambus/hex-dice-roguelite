<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex &amp; Dice Roguelite</title>
  <meta name="description" content="A solo hex-and-dice roguelite: build an island, bend the dice, pay the tribute.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 90,27 90,73 50,95 10,73 10,27' fill='%23e8c547' stroke='%23333' stroke-width='6'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Hex &amp; Dice <small>draft 0.2</small></div>
      <div id="status" class="status"></div>
      <nav class="menu">
        <button data-top="log" title="Show the game log">Log</button>
        <button data-top="help" title="How to play">Help</button>
        <button data-top="dev" title="Testing tools">Dev</button>
        <button data-top="new" title="Start a new run">New run</button>
      </nav>
    </header>
    <main class="main">
      <section id="stage" class="stage">
        <svg id="board" viewBox="-5.3 -4.9 10.6 9.8" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Game board"></svg>
        <div id="prompt" class="board-prompt" hidden></div>
        <div id="overlay" class="stage-overlay" hidden></div>
      </section>
      <aside id="panel" class="panel"></aside>
    </main>
    <footer id="hand" class="hand"></footer>
  </div>
  <div id="drawer"></div>
  <div id="modal-root"></div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
