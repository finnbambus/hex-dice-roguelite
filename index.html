<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex &amp; Dice Roguelite</title>
  <meta name="description" content="A solo hex-and-dice roguelite: build an island, bend the dice, pay the tribute.">
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 90,27 90,73 50,95 10,73 10,27' fill='%23ff4a1c'/></svg>">
  <link rel="preload" href="assets/fonts/grenze-gotisch-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=27">
  <link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>
  <div class="app">
    <main class="main">
      <section id="stage" class="stage">
        <div id="board" class="board" role="img" aria-label="Game board"></div>
        <div class="lamp" aria-hidden="true"></div>
        <div class="menu">
          <button id="menu-btn" class="menu-btn" aria-haspopup="true" aria-expanded="false" title="Menu" aria-label="Menu"><i></i><i></i><i></i></button>
          <div id="menu-pop" class="menu-pop" hidden>
            <button data-top="log" title="Show the game log">Log</button>
            <button data-top="tutorial" title="A guided tour of the screen">Tutorial</button>
            <button data-top="help" title="Rules summary">Help</button>
            <button data-top="dev" title="Testing tools">Dev tools</button>
            <button data-top="new" title="Start a new run">New run</button>
            <label class="switch" title="Shake the table on big hits"><input id="opt-shake" type="checkbox" checked><span>Screen shake on big hits</span></label>
          </div>
        </div>
        <div id="prompt" class="board-prompt" hidden></div>
        <footer id="hand" class="hand"></footer>
        <div id="overlay" class="stage-overlay" hidden></div>
        <div class="rcol">
          <section id="tribute" class="tribute" aria-label="Ante, tribute and boss"></section>
          <aside id="panel" class="panel"></aside>
        </div>
      </section>
    </main>
  </div>
  <div id="drawer"></div>
  <div id="modal-root"></div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js?v=27"></script>
</body>
</html>
